# 已删库 https://raw.githubusercontent.com/Yu9191/NeteasemusicAd/main/wyy.sgmodule
name: YouTube去广告隐藏Shorts
description: 适用于 Youtube去广告
author: Maasea[https://github.com/Maasea], ZenmoFeiShi[https://github.com/ZenmoFeiShi/Qx]
icon: https://raw.githubusercontent.com/Ezrea7/Rules/main/Icons/AppIcons/Image/App/YouTube.png
dns: {}
rewrites:
- match: ^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?&ctier=L(&.+?),ctier,(.+)
  actions:
  - redirect:
      status: 302
      location: https://$1$2$3
- match: ^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad
  actions:
  - respond:
      status: 200
- match: ^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads
  actions:
  - respond:
      status: 200
- match: ^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking)
  actions:
  - respond:
      status: 200
- match: ^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext
  actions:
  - respond:
      status: 200
scriptings:
- http_response:
    name: YouTube去广告
    match: ^https?:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch)
    script_url: https://raw.githubusercontent.com/Ezrea7/Rules/main/JS/YouTube/JS/JS-2/YouTube.js
    timeout: 60
    body_required: true
    binary_body: true
mitm:
  hostnames:
    includes:
    - '*.googlevideo.com'
    - redirector*.googlevideo.com
    - www.youtube.com
    - s.youtube.com
    - youtubei.googleapis.com
