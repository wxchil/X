name: 京东比价
description: 首次使用需安装慢慢买应用，之后点击进入[我的]页面以捕获Cookie，捕获成功后方可在商品详情页面查看比价内容。
open_url: https://apps.apple.com/app/id414245413
author: wf021325[https://github.com/wf021325], githubdulong[https://github.com/githubdulong], mw418[https://github.com/mw418]
homepage:
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png
dns: {}
rewrites:
- name: 捕获令牌
  match: (?i)^https?://apapia-sqk-weblogic\.manmanbuy\.com/baoliao/center/menu$
  actions:
  - request_script:
      name: 捕获令牌
      url: https://kelee.one/Resource/JavaScript/JD/JD_Price.js
      timeout: 10
      body_required: true
- name: 京东比价
  match: (?i)^https?://in\.m\.jd\.com/product/graphext/\d+\.html
  actions:
  - response_script:
      name: 京东比价
      url: https://kelee.one/Resource/JavaScript/JD/JD_Price.js
      timeout: 10
      body_required: true
mitm:
  hostnames:
    includes:
    - in.m.jd.com
    - apapia-sqk-weblogic.manmanbuy.co
